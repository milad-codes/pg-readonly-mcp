name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, tests (PostgreSQL 16), build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mcp
          POSTGRES_PASSWORD: mcp
          POSTGRES_DB: mcp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mcp -d mcp_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # integration tests are skipped when this is unset
      DATABASE_URL: postgresql://mcp:mcp@localhost:5432/mcp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run build
      - name: Demo against the synthetic shop database
        env:
          PGPASSWORD: mcp
        run: |
          psql -h localhost -U mcp -d mcp_test -c 'CREATE DATABASE shop'
          psql -h localhost -U mcp -d shop -v ON_ERROR_STOP=1 -q -f examples/shop.sql
          DATABASE_URL=postgresql://mcp_reader:mcp_reader@localhost:5432/shop node scripts/demo.mjs

  docker:
    name: Container image (build + MCP smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mcp
          POSTGRES_PASSWORD: mcp
          POSTGRES_DB: mcp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mcp -d mcp_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pg-readonly-mcp:ci .
      - name: Speak MCP over stdio to the container
        run: |
          docker run -i --rm --network host \
            -e DATABASE_URL=postgresql://mcp:mcp@localhost:5432/mcp_test \
            pg-readonly-mcp:ci < test/smoke/requests.jsonl > responses.jsonl
          cat responses.jsonl
          jq -e 'select(.id == 2) | .result.tools | length == 4' responses.jsonl
          jq -e 'select(.id == 3) | .result.structuredContent.rows[0].answer == 42' responses.jsonl
          jq -e 'select(.id == 4) | .result.isError == true' responses.jsonl
      - name: Image runs as non-root
        run: test "$(docker run --rm --entrypoint id pg-readonly-mcp:ci -u)" != "0"
